<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b29"/>
      <stop offset="100%" stop-color="#ff5400"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Mark -->
  <rect x="8" y="10" width="44" height="44" rx="12" fill="url(#logoGrad)" filter="url(#logoGlow)"/>
  <path d="M26 22 L38 32 L26 42 Z" fill="#ffffff"/>
  <circle cx="39" cy="22" r="3" fill="#ffffff" opacity="0.8"/>

  <!-- Brand Typography -->
  <text x="64" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">ANI<tspan fill="#ff640a">WAVEX</tspan></text>
</svg>
