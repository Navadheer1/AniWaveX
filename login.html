<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AniWaveX Anime Streaming</title>
  <meta name="description" content="Sign in to your AniWaveX account to access your customized watchlist, viewing history, and stream high-definition anime.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff640a'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z'/></svg>">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" aria-label="AniWaveX Homepage">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </span>
        Ani<span class="accent">WaveX</span>
      </a>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to your account to resume streaming</p>
    </div>

    <!-- Quick Demo Box for Reviewers -->
    <div class="demo-login-box">
      <div class="demo-login-text">Evaluation Mode: Test login with 1 click</div>
      <button type="button" class="demo-login-btn" id="demoLoginBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.38 1.19-4.47 3-5.74L6.58 4.84A8.962 8.962 0 0 0 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
        Instant Demo Login
      </button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="emailInput">Email Address</label>
        <div class="form-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" id="emailInput" placeholder="name@example.com" required>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="passwordInput">Password</label>
        <div class="form-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
          <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <!-- Remember & Forgot -->
      <div class="form-helpers">
        <label class="remember-checkbox">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link" onclick="showToast('Password reset link sent to demo email', 'info'); return false;">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px;">
        Sign In to AniWaveX
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create an Account</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
