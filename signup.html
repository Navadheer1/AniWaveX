<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - AniWaveX Anime Streaming</title>
  <meta name="description" content="Sign up for AniWaveX to start tracking your favorite anime, creating custom watchlists, and streaming thousands of episodes.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff640a'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z'/></svg>">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="brand-logo" aria-label="AniWaveX Homepage">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        </span>
        Ani<span class="accent">WaveX</span>
      </a>
      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join thousands of anime fans streaming in HD</p>
    </div>

    <!-- Sign Up Form -->
    <form id="signupForm" novalidate>
      <!-- Username -->
      <div class="form-group">
        <label class="form-label" for="usernameInput">Username</label>
        <div class="form-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" id="usernameInput" placeholder="AnimeLover99" required>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="emailInput">Email Address</label>
        <div class="form-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          <input type="email" id="emailInput" placeholder="name@example.com" required>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="passwordInput">Password</label>
        <div class="form-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="passwordInput" placeholder="Minimum 6 characters" required>
          <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
        <!-- Live Strength Meter -->
        <div class="strength-meter-container">
          <div class="strength-bar-bg">
            <div class="strength-bar-fill" id="strengthBarFill"></div>
          </div>
          <div class="strength-label">
            <span>Strength: <strong id="strengthText">None</strong></span>
            <span>Numbers & symbols recommended</span>
          </div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label class="form-label" for="confirmPasswordInput">Confirm Password</label>
        <div class="form-input-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="confirmPasswordInput" placeholder="Repeat your password" required>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div class="form-helpers" style="margin-bottom: 20px;">
        <label class="remember-checkbox">
          <input type="checkbox" id="termsCheck" required checked>
          <span>I agree to the <a href="#" style="color: var(--accent-orange);">Terms</a> & <a href="#" style="color: var(--accent-orange);">Privacy Policy</a></span>
        </label>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 13px;">
        Create My Free Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign In</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
